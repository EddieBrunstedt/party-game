[workspace]
resolver = "3"
members = [
    "crates/sim-core",
    "crates/sim-check",
    "crates/sim-board",
    "crates/minigames/*",
    "crates/registry",
    "crates/net",
    "crates/game",
    "crates/tools",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
sim-core = { path = "crates/sim-core" }
sim-check = { path = "crates/sim-check" }
sim-board = { path = "crates/sim-board" }
minigame-registry = { path = "crates/registry" }
net = { path = "crates/net" }
minigame-quick-draw = { path = "crates/minigames/quick-draw" }
minigame-lantern-push = { path = "crates/minigames/lantern-push" }
minigame-firefly-catch = { path = "crates/minigames/firefly-catch" }
minigame-lantern-echo = { path = "crates/minigames/lantern-echo" }
minigame-lantern-tower = { path = "crates/minigames/lantern-tower" }
bevy = "0.20"
# Git main until its Bevy 0.20 release (ADR 0005): "Migrate to Bevy 0.20 and WESL shaders (#576)".
bevy_hanabi = { git = "https://github.com/djeedai/bevy_hanabi", rev = "77630ff1eed8b104f34e91d23e9440428dc5ab01", default-features = false, features = ["3d"] }
# Sounds are synthesized in code (game/src/sfx.rs). WAV is the one decoder, and bevy_kira_audio
# doesn't build without at least one.
bevy_kira_audio = { version = "0.27", default-features = false, features = ["wav"] }
kira = { version = "0.12", default-features = false }
ggrs = { version = "0.13", features = ["sync-send"] }
libm = "0.2"
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
ron = "0.12"
clap = { version = "4", features = ["derive"] }

# Bevy is unusably slow without optimizing dependencies; keep our own code fast to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
