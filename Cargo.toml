[workspace]
resolver = "3"
members = ["crates/sim-core", "crates/sim-check", "crates/minigames/*", "crates/game", "crates/tools"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
sim-core = { path = "crates/sim-core" }
sim-check = { path = "crates/sim-check" }
minigame-quick-draw = { path = "crates/minigames/quick-draw" }
bevy = "0.20"
ggrs = { version = "0.13", features = ["sync-send"] }
libm = "0.2"
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }

# Bevy is unusably slow without optimizing dependencies; keep our own code fast to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
